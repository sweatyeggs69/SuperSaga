name: Bug report
description: Something in SuperSaga or the game doesn't work right.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach or link a ROM or BIOS file, or share a RetroAchievements password or token.** Issues that do will be deleted.
        Can't open the app or your ROM isn't accepted? See [Getting started](https://github.com/sweatyeggs69/SuperSaga#getting-started) first. Only Mario & Luigi: Superstar Saga (USA) is supported.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I am on the [latest release](https://github.com/sweatyeggs69/SuperSaga/releases/latest) and searched the [existing issues](https://github.com/sweatyeggs69/SuperSaga/issues?q=is%3Aissue).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game or which menu, and what you pressed. Say if it happens every time.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SuperSaga version
      description: Shown in Settings (F1) > About.
      placeholder: "1.7.0"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: Optional. Drag files here. Helpful for graphics or sound problems.

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Optional. Start SuperSaga from a terminal with `--verbose` and paste what it prints.
      render: text
