name: Feature request
description: Suggest a new feature or an improvement to SuperSaga.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The feature or change, and why it would help.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Optional. Screenshots, mockups, or how another emulator or port does it.
